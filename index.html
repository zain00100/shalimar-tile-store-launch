        body {
            /* Loads bg.jpg from your GitHub repository with a bright light overlay for readability */
            background: linear-gradient(rgba(255 255 255 / 0%), rgb(255 255 255 / 0%)), url(bg.jpg) center / cover no-repeat;

            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            width: 100%;
                background: rgb(255 4 4 / 63%);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(239, 68, 68, 0.15);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }
        .logo {
            max-width: 160px;
            height: auto;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.8rem;
            margin-bottom: 12px;
            letter-spacing: 1px;
            font-weight: 700;
            color: #f8fa03; /* Deep rich red */
        }
        p {
            color: #f8fa03;
            font-size: 1.1rem;
            margin-bottom: 35px;
            line-height: 1.6;
        }
        .timer {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }
        .time-box {
            background: #ffffff;
            border: 1px solid #fecaca;
            padding: 18px;
            border-radius: 12px;
            min-width: 90px;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.05);
        }
        .time-box span {
            display: block;
            font-size: 2.3rem;
            font-weight: bold;
            color: #dc2626; /* Vivid red */
        }
        .time-box label {
            font-size: 0.75rem;
            color: #71717a;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
            display: block;
            font-weight: 600;
        }
        .newsletter {
            display: flex;
            justify-content: center;
            margin-bottom: 35px;
        }
        .newsletter input {
            padding: 14px 18px;
            width: 65%;
            max-width: 320px;
            border: 1px solid #d4d4d8;
            background: #ffffff;
            color: #b91c1c;
            border-radius: 8px 0 0 8px;
            outline: none;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .newsletter input:focus {
            border-color: #dc2626;
        }
        .newsletter button {
            padding: 14px 22px;
                background: #dc2626;
    color: #ffffff;
            border: none;
            font-weight: 700;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }
        .newsletter button:hover {
            background: #ffffff;
			color:#b91c1c;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 16px;
        }
        .social-links a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #ffffff;
            border: 1px solid #e4e4e7;
            color: #3f3f46;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
        }
        .social-links a:hover {
            background: #dc2626;
            color: #ffffff;
            transform: translateY(-3px);
            border-color: #dc2626;
        }
        .social-links svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            .container { padding: 25px 15px; }
            .time-box { min-width: 70px; padding: 12px; }
            .time-box span { font-size: 1.6rem; }
        }
    </style>
</head>

    <script>
        const launchDate = new Date("Dec 15, 2026 23:59:59").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = launchDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');

            if (distance < 0) {
                clearInterval(timer);
                document.querySelector(".container").innerHTML = "<h1>We Are Live!</h1>";
            }
        }, 1000);
    </script>
